# Render Blueprint for the AI skill-gap test deployment (Blueprint SkillTrackAIv1, branch
# feature/skill-gap-analysis-agent): FastAPI API + static React site. Render added the suffix -wk21 to both
# addresses, so the three URLs below point at the -wk21 services. Revert this file to the main version before
# merging this branch into main or deploy-maria-safe, or the live site would be pointed at these services.
# The database is Neon PostgreSQL in AWS us-east-2 (Ohio), so the API runs in Render's Ohio region next to it.
# Addresses: https://skilltrack-maria-api-wk21.onrender.com and https://skilltrack-maria-web-wk21.onrender.com
# If Render has to add a suffix to a name, update the three URLs below to match.
services:
  - type: web
    name: skilltrack-maria-api
    runtime: python
    region: ohio
    rootDir: skilltrack-api
    plan: free
    buildCommand: pip install -r requirements.txt && python migrate_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL  # the Neon connection string, entered in the Render dashboard (never committed)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://skilltrack-maria-web-wk21.onrender.com
      - key: FRONTEND_URL  # used in the "Verify at" link on certificate PDFs
        value: https://skilltrack-maria-web-wk21.onrender.com
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: skilltrack-maria-web
    runtime: static
    rootDir: skilltrack
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://skilltrack-maria-api-wk21.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Render Blueprint for Maria's deployment (branch deploy-maria): FastAPI API + static React site.
# The database is Neon PostgreSQL in AWS us-east-2 (Ohio), so the API runs in Render's Ohio region next to it.
# Service names are also the addresses: https://skilltrack-maria-api.onrender.com and https://skilltrack-maria-web.onrender.com
# If Render has to add a suffix to a name, update the three URLs below to match.
services:
  - type: web
    name: skilltrack-maria-api
    runtime: python
    region: ohio
    rootDir: skilltrack-api
    plan: free
    buildCommand: pip install -r requirements.txt && python migrate_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL  # the Neon connection string, entered in the Render dashboard (never committed)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://skilltrack-maria-web.onrender.com
      - key: FRONTEND_URL  # used in the "Verify at" link on certificate PDFs
        value: https://skilltrack-maria-web.onrender.com
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: skilltrack-maria-web
    runtime: static
    rootDir: skilltrack
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The site calls the API through its own address (rewrite below), so the browser treats the API as
      # same-site and keeps the httpOnly refresh cookie (path /api/auth)
      - key: VITE_API_URL
        value: /api
    routes:
      # Order matters: API calls first, then every other path serves the React app
      - type: rewrite
        source: /api/*
        destination: https://skilltrack-maria-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Only this site's own scripts may run, so an injected <script> or inline handler is blocked.
      # blob: is for the certificate PDF and badge previews the pages create.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
